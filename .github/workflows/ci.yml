name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 22.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24
    - run: npm i && npm run lint
  
  PrepareSupportedVersions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 22.x
      uses: actions/setup-node@v1.4.4
      with:
        node-version: 24
    - id: set-matrix
      run: |
        node -e "
          const v = require('./lib/version').testedVersions;
          // These servers burn 25-220 CPU-seconds building their data fixers
          // at startup, enough to stall anything sharing their 4-core runner,
          // so each gets its own; the rest share a runner in pairs.
          const slow = ['1.13.2', '1.14.4', '1.15.2', '1.16.5', '1.17.1', '1.18.2'];
          const groups = v.filter(x => slow.includes(x)).map(x => [x]);
          const rest = v.filter(x => !slow.includes(x));
          for (let i = 0; i < rest.length; i += 2) groups.push(rest.slice(i, i + 2));
          console.log('matrix='+JSON.stringify({'include': groups.map(g => ({ versions: g.join(' ') }))}))
        " >> $GITHUB_OUTPUT

  MinecraftServer:
    needs: PrepareSupportedVersions
    runs-on: ubuntu-24.04-arm
    name: MC ${{ matrix.versions }}
    strategy:
      matrix: ${{ fromJson(needs.PrepareSupportedVersions.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 22.x
        uses: actions/setup-node@v1.4.4
        with:
          node-version: 24
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # There is no lockfile, so the date in the key is what picks up new
      # dependency releases: at most a day late, and npm install below
      # still runs on top of whatever is restored.
      - id: date
        run: echo "date=$(date -u +%F)" >> $GITHUB_OUTPUT
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}-${{ steps.date.outputs.date }}
      - name: Install Dependencies
        run: npm install

      # Restored and saved separately: actions/cache only saves when the job
      # passes, and a failing test shouldn't cost the next run its jars.
      - name: Restore server jars
        id: jars
        uses: actions/cache/restore@v4
        with:
          path: server_jars
          key: server-jars-${{ matrix.versions }}

      # Per-test durations from the last master run of this version group, so a PR gets a
      # comment listing tests it made more than 2x slower (test/common/compareDurations.js).
      - name: Restore duration baseline
        uses: actions/cache/restore@v4
        with:
          path: durations
          key: durations-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: durations-${{ strategy.job-index }}-
      - run: |
          mv durations baseline 2>/dev/null || mkdir -p baseline
          mkdir -p durations

      - name: Start Tests
        run: |
          # Each version runs its internal tests, which need no server, in a
          # separate process alongside its external tests. They finish well
          # within the external ones, so they're niced to leave the CPU to the
          # servers starting up.
          parts=""
          pids=""
          for v in ${{ matrix.versions }}; do
            for kind in external internal; do
              p="$v-$kind"
              nice=""
              [ $kind = internal ] && nice="nice -n 10"
              parts="$parts $p"
              # TRACE is cheap (<1% runtime) and only written by the harness bot,
              # so always record a packet trace for post-mortem analysis.
              TRACE="trace-${p}.jsonl" DURATIONS="durations/durations-${p}.json" $nice npm run mocha_test -- --retries 3 -g "mineflayer_${kind} ${v}v" > "test-${p}.log" 2>&1 &
              pids="$pids $!"
            done
          done
          exit_code=0
          for pid in $pids; do
            wait $pid || exit_code=$?
          done
          # Print passing parts first, then failing parts last
          for p in $parts; do
            if ! grep -q "failing" "test-${p}.log"; then
              echo ""
              echo "=========================================="
              echo "  Results for Minecraft ${p}"
              echo "=========================================="
              cat "test-${p}.log"
            fi
          done
          for p in $parts; do
            if grep -q "failing" "test-${p}.log"; then
              echo ""
              echo "=========================================="
              echo "  FAILED: Minecraft ${p}"
              echo "=========================================="
              cat "test-${p}.log"
            fi
          done
          # Only the failing parts' logs and packet traces are uploaded,
          # so artifact storage stays small; they auto-expire quickly too.
          mkdir -p artifacts
          for p in $parts; do
            if grep -q "failing" "test-${p}.log"; then
              cp "test-${p}.log" artifacts/
              cp "trace-${p}.jsonl" artifacts/ 2>/dev/null || true
            fi
          done
          exit $exit_code

      - name: Save server jars
        if: always() && steps.jars.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: server_jars
          key: server-jars-${{ matrix.versions }}

      - name: Compare test durations against master
        run: |
          mkdir -p slower
          echo "${{ github.event.pull_request.number }}" > slower/pr
          node test/common/compareDurations.js baseline durations "slower/${{ strategy.job-index }}.txt"

      # Fork PRs get a read-only token, so the comment is posted by
      # duration-comment.yml from this artifact instead of from here.
      - name: Upload slower tests for the PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: slower-${{ strategy.job-index }}
          path: slower

      - name: Save duration baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: durations
          key: durations-${{ strategy.job-index }}-${{ github.sha }}

      - name: Upload failed versions' logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-versions-${{ strategy.job-index }}
          path: artifacts/
          retention-days: 7
